[tool.pyrefly]
search-path = [
    "backend",
    "backend/app"
]
site-package-path = [
    ".venv/Lib/site-packages"
]
site-packages-path = [
    ".venv/Lib/site-packages"
]
python-interpreter-path = ".venv/Scripts/python.exe"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    "backend",
    "backend/app",
    ".venv/Lib/site-packages"
]
executionEnvironments = [
  { root = "backend", extraPaths = ["backend", "backend/app", ".venv/Lib/site-packages"] }
]

[tool.pytest.ini_options]
pythonpath = [
  "backend"
]
