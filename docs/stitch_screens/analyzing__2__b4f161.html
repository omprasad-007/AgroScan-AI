<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
        .scanner-line {
            animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.5; box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.4); }
            70% { opacity: 1; box-shadow: 0 0 0 10px rgba(46, 125, 50, 0); }
            100% { opacity: 0.5; box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
        }
        .pulse-active {
            animation: pulse-glow 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface h-full flex flex-col font-sans text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Suppressed TopAppBar & BottomNavBar as this is a linear/transactional loading screen -->
<main class="flex-grow flex flex-col items-center justify-center p-container-margin md:px-0 max-w-lg mx-auto w-full relative z-10">
<!-- Header Text -->
<div class="text-center mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2 tracking-tight">AI Analysis in Progress</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Our AI is examining your crop... Please wait.</p>
</div>
<!-- Scanning Visual -->
<div class="relative w-full max-w-sm aspect-square bg-surface-container rounded-xl overflow-hidden shadow-[0_-4px_6px_-1px_rgba(27,94,32,0.08)] mb-10 border border-outline-variant">
<!-- Captured Image Placeholder -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A close-up, highly detailed photograph of a green agricultural crop leaf being scanned. The leaf has subtle signs of yellowing on the edges. The lighting is bright outdoor daylight, casting soft shadows. The overall aesthetic is professional, agricultural, and modern, using a color palette dominated by deep organic greens and off-white neutrals." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBRaUy8q-54SM4uVL81LqXTYTpI_KCOhCKg3trivqij2nw_3A0V1Go8_xw2PwuNNXFp2_m8xvCSvF9A0fHFiQxSKgt_1zKH1NCfWdRpFbw6wgqEc7_hGJAFKOqd4_VGLSFLjU7yrUSrfRP7LTe-uY7_YgNCNY8nIfNBFCqlwk0z6NcoiLLHvf7il8O_Xw5mZs3VYsI_X9rEYHk70Ir51Wojx_CJwvcMwxoX0GxpmgGcDXXmkigzfaCzig')"></div>
<!-- Scanner Overlay -->
<div class="absolute inset-0 bg-primary/10 mix-blend-overlay"></div>
<!-- Scanner Line -->
<div class="scanner-line absolute left-0 right-0 h-1 bg-primary-fixed shadow-[0_0_15px_3px_rgba(46,125,50,0.6)] z-20"></div>
<!-- Corner Reticles -->
<div class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-primary-fixed z-10"></div>
<div class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-primary-fixed z-10"></div>
<div class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-primary-fixed z-10"></div>
<div class="absolute bottom-4 right-4 w-6 h-6 border-b-2 border-r-2 border-primary-fixed z-10"></div>
</div>
<!-- Status Steps (Bento-style list) -->
<div class="w-full max-w-sm flex flex-col gap-3">
<!-- Step 1: Done -->
<div class="flex items-center gap-4 bg-surface-container-lowest p-3 rounded-lg border border-outline-variant opacity-80">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined" data-icon="check" data-weight="fill" style="font-size: 16px;">check</span>
</div>
<div class="flex-grow">
<p class="font-label-md text-label-md text-on-surface line-through decoration-on-surface-variant">Image preprocessing</p>
</div>
</div>
<!-- Step 2: Active -->
<div class="flex items-center gap-4 bg-surface-container-low p-3 rounded-lg border-2 border-primary shadow-sm relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5"></div>
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center flex-shrink-0 pulse-active relative z-10">
<span class="material-symbols-outlined" data-icon="sync" data-weight="fill" style="font-size: 16px;">sync</span>
</div>
<div class="flex-grow relative z-10">
<p class="font-label-md text-label-md text-primary font-bold">Crop identification</p>
</div>
<div class="relative z-10">
<span class="flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-primary"></span>
</span>
</div>
</div>
<!-- Step 3: Pending -->
<div class="flex items-center gap-4 bg-surface-container-lowest p-3 rounded-lg border border-outline-variant opacity-60">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center flex-shrink-0">
<span class="font-label-md text-label-md">3</span>
</div>
<div class="flex-grow">
<p class="font-label-md text-label-md text-on-surface-variant">Disease detection</p>
</div>
</div>
<!-- Step 4: Pending -->
<div class="flex items-center gap-4 bg-surface-container-lowest p-3 rounded-lg border border-outline-variant opacity-40">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center flex-shrink-0">
<span class="font-label-md text-label-md">4</span>
</div>
<div class="flex-grow">
<p class="font-label-md text-label-md text-on-surface-variant">Severity analysis</p>
</div>
</div>
<!-- Step 5: Pending -->
<div class="flex items-center gap-4 bg-surface-container-lowest p-3 rounded-lg border border-outline-variant opacity-30">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center flex-shrink-0">
<span class="font-label-md text-label-md">5</span>
</div>
<div class="flex-grow">
<p class="font-label-md text-label-md text-on-surface-variant">Recommendation generation</p>
</div>
</div>
</div>
<!-- Cancel Button (Tertiary/Ghost as per design system) -->
<button class="mt-8 font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors min-h-[48px] px-4 flex items-center justify-center">
            Cancel Analysis
        </button>
</main>
<!-- Optional subtle background texture -->
<div class="fixed inset-0 pointer-events-none opacity-20 mix-blend-multiply bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-container-high to-transparent z-0"></div>
